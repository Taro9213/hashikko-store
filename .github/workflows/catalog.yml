# Whenever parts change on main: rebuild catalog.json (what the app reads) and publish the store website (GitHub Pages).
# Repository settings → Pages → Source: "GitHub Actions".
# Repository settings → Secrets and variables → Actions → Variables:
#   SITE_URL   the main Hashikko website, e.g. https://<you>.github.io/hashikko/
#   STATS_URL  the service's stats, e.g. https://hashikko-store.<you>.workers.dev/v1/stats
name: Build catalog and website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every part and build the catalog
        run: node tools/build-catalog.mjs
      - name: Save catalog.json if it changed
        run: |
          git config user.name "hashikko-bot"
          git config user.email "hashikko-bot@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || (git commit -m "Update catalog" && git push)
      - name: Build the store website
        env:
          HASHIKKO_SITE: ${{ vars.SITE_URL }}
          HASHIKKO_STATS_URL: ${{ vars.STATS_URL }}
        run: node tools/build-web.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
